[project]
name = "ai-director-backend"
version = "0.1.0"
description = "影视多智能体协作平台 — 后端（FastAPI 模块化单体）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "openai>=1.30,<2.0",
    "markdown-it-py>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "psutil>=5.9,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0,<3.0",
    "mutmut>=2.4,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: L1 单元测试（模块内，依赖 mock）",
    "integration: L2 集成测试（真实 DB 全链路）",
    "e2e: L3 端到端测试（跨组件公开接口）",
    "architecture: 架构约束可执行检查",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/ 为 Alembic 生成代码（禁止手改），排除 lint/format 检查
extend-exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入约定：参数默认值中调用 Depends 是官方推荐写法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

# 模块边界契约（映射表见 docs/architecture_checks.md §2）：新领域模块落地时同步登记
# source 须枚举兄弟模块而非整包 app（app 含全部后代，会把模块内部合法引用误判为违规）
# 内部层私有契约 allow_indirect_imports=true：只拦截「外部模块直接 import 内部层」，
# 不做传递闭包（否则组合根 main 挂路由、service 间合法调用会经模块自身装配边误报）
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "core 零业务依赖（core/CONSTRAINTS.md）"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.entities", "app.relations", "app.perspectives"]

[[tool.importlinter.contracts]]
name = "entities 内部层私有：跨模块仅经 service（根 CONSTRAINTS §2）"
type = "forbidden"
source_modules = ["app.core", "app.main", "app.relations", "app.perspectives"]
forbidden_modules = ["app.entities.repository", "app.entities.models", "app.entities.schemas"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "relations 内部层私有：跨模块仅经 service（根 CONSTRAINTS §2）"
type = "forbidden"
source_modules = ["app.core", "app.main", "app.entities", "app.perspectives"]
forbidden_modules = ["app.relations.repository", "app.relations.models", "app.relations.schemas"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "perspectives 内部层私有：跨模块仅经 service（根 CONSTRAINTS §2）"
type = "forbidden"
source_modules = ["app.core", "app.main", "app.entities", "app.relations"]
forbidden_modules = ["app.perspectives.schemas"]
allow_indirect_imports = true
